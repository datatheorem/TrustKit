name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftlint clang-format
      - run: ./scripts/lint.sh --check

  test:
    name: Test ${{ matrix.platform }}
    needs: lint
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Re-add watchos-simulator once https://github.com/actions/runner-images/issues/14946 is fixed.
        platform: [ios-simulator, macos, maccatalyst, tvos-simulator, visionos-simulator]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'watchos-simulator'
        run: ./scripts/install_simulator_runtime.sh ${{ matrix.platform }}
      - run: ./scripts/run_unit_tests.sh ${{ matrix.platform }} -retry-tests-on-failure -test-iterations 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.platform }}-tests
          path: output/*.xcresult
          if-no-files-found: ignore

  demo:
    name: Demo UI tests ${{ matrix.scheme }}
    needs: lint
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [TrustKitDemo-ObjC, TrustKitDemo-Swift]
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/run_demo_ui_tests.sh ${{ matrix.scheme }} -retry-tests-on-failure -test-iterations 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.scheme }}-ui-tests
          path: output/*.xcresult
          if-no-files-found: ignore

  xcframework:
    name: Build XCFramework
    needs: lint
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/build_xcframework.sh

  swift-package:
    name: Validate Swift package
    needs: lint
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/validate_swift_package.sh
